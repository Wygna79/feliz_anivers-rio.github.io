<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Meu Site Teste</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
        }

        header {
            background-color: #4CAF50;
            color: white;
            padding: 15px;
            text-align: center;
        }

        main {
            padding: 20px;
        }

        .card {
            background-color: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            margin-bottom: 15px;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px;
            position: fixed;
            width: 100%;
            bottom: 0;
        }
    </style>
</head>
<body>

<header>
    <h1>Meu Primeiro Site</h1>
    <p>Teste simples de HTML e CSS</p>
</header>

<main>
    <div class="card">
        <h2>Sobre mim</h2>
        <p>Olá! Esse é um site de teste criado por mim 😄</p>
    </div>

    <div class="card">
        <h2>Habilidades</h2>
        <ul>
            <li>HTML</li>
            <li>CSS</li>
            <li>Aprendendo JavaScript</li>
        </ul>
    </div>
</main>

<footer>
    <p>© 2026 - Meu Site Teste</p>
</footer>

</body>
</html>
